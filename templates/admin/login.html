{% extends "base.html" %}
{% block title %}Administrator Login{% endblock %}
{% block content %}
<div class="container narrow">
    <form class="panel login-card" method="post" action="{{ url_for('admin_login', next=request.args.get('next')) }}" novalidate data-validate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <img src="{{ url_for('static', filename='images/airline_logo.svg') }}" alt="SkyLink Airlines logo" width="56" height="56">
        <h1>Administrator Login</h1>
        <p class="muted">Restricted area for SkyLink Airlines staff.</p>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username" autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
</div>
{% endblock %}
