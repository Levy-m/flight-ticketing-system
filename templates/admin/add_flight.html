{% extends "base.html" %}
{% block title %}Add Flight{% endblock %}
{% block content %}
{% include "admin/_nav.html" %}
<div class="container">
    <h1 class="admin-title">Add a new flight</h1>
    <form method="post" action="{{ url_for('admin_add_flight') }}" novalidate data-validate>
        {% include "admin/_flight_form.html" %}
        <div class="form-actions">
            <button type="submit" class="btn btn-accent">Save flight</button>
            <a href="{{ url_for('admin_flights') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
