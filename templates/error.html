{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container narrow">

        <div class="error-code">{{ code }}</div>
        <h1>{{ title }}</h1>

        <a href="{{ url_for('index') }}" class="btn btn-primary">Go to the home page</a>
    </div>
</div>
{% endblock %}
